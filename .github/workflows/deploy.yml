name: Build OmniLLVM Toolchain

on:
  push:
    branches:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Versão da Release (deixe vazio para auto-incrementar: 1, 2, 3...)'
        required: false
        default: ''
      rebuild_core:
        description: 'Forçar recompilação do Stage 1 do zero? (false = usa cache)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      rebuild_frontends:
        description: 'Forçar recompilação do Stage 2 (Flang/Ada/Rust)? (false = usa cache)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      rebuild_package:
        description: 'Forçar re-empacotamento do Stage 3? (false = usa cache)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

env:
  INSTALL_PREFIX: /opt/omnillvm
  # ==========================================================================
  # VERSÕES OFICIAIS ESTÁVEIS FIXADAS (PURE COMPILERS — ZERO PACKAGE MANAGERS):
  # Swift 6.4.1 + LLVM 21 (swift/release/6.4.1) | Rustc 1.94.0 | GNAT 27.1 | Flang+flang-rt 21
  # ==========================================================================
  SWIFT_SCHEME: release/6.4.1
  SWIFT_LLVM_BRANCH: swift/release/6.4.1
  SWIFT_BOOTSTRAP_VER: 6.4.1
  RUST_BRANCH: 1.94.0
  GNAT_LLVM_BRANCH: release/27.1
  GCC_ADA_BRANCH: releases/gcc-16
  # Chaves de Cache para a arquitetura hermética (Sem Cargo/SPM + Com flang-rt nativo)
  CORE_CACHE_REV: v15-swift-641-no-backtrace
  FRONTEND_CACHE_REV: v11-hermetic-frontends
  PACKAGE_CACHE_REV: v11-hermetic-pkg
  DEBIAN_FRONTEND: noninteractive
  MAX_OPT_FLAGS: "-O3 -pipe -fno-plt -g0 -DNDEBUG"
  CCACHE_TEMPDIR: "/dev/shm/ccache-tmp"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "1"
  CCACHE_COMPILERCHECK: "content"
  CCACHE_SLOPPINESS: "pch_defines,time_macros"

jobs:
  # ============================================================================
  # ESTÁGIO 1: Core em Container Ubuntu 26.04 (AMD64 + ARM64)
  # Compila LLVM 21 + Clang + LLD + LLDB + Swiftc 6.4.1 + libdispatch + Runtimes Pure LLVM
  # (Zero Swift Package Manager / Zero ferramentas de pacotes externos)
  # ============================================================================
  build-core:
    name: "Stage 1: Core LLVM+Swiftc 6.4.1 [Ubuntu 26.04 - ${{ matrix.arch }}]"
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
      # /tmp precisa permitir execucao: o Swift/CMake cria e executa binarios de teste ali.
      options: --privileged -v /opt:/opt --shm-size=8g --tmpfs /tmp:rw,exec,nosuid,size=6g,mode=1777
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
            llvm_build_subdir: "llvm-linux-x86_64"
            gnu_triple: x86_64-linux-gnu
            swift_url_arch: ""
            swift_dir_arch: ""
          - arch: arm64
            runner: ubuntu-26.04-arm
            llvm_build_subdir: "llvm-linux-aarch64"
            gnu_triple: aarch64-linux-gnu
            swift_url_arch: "-aarch64"
            swift_dir_arch: "-aarch64"

    steps:
      - name: 0A. Preparar ZSTD para o Cache do GitHub no Ubuntu 26.04
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends zstd ca-certificates tar

      - name: Checkout
        uses: actions/checkout@v4

      - name: 0B. Restaurar Cache do Core SDK Pronto (Stage 1 - 6.4.1)
        id: core-cache
        if: inputs.rebuild_core != 'true'
        uses: actions/cache/restore@v4
        with:
          path: core-sdk-${{ matrix.arch }}.tar.zst
          key: omnillvm-core-${{ env.CORE_CACHE_REV }}-${{ matrix.arch }}
          restore-keys: |
            omnillvm-core-${{ env.CORE_CACHE_REV }}-${{ matrix.arch }}

      - name: 1. Instalar Dependências, Swift Host Bootstrap e Tuning Máximo de CPU/RAM
        id: hw
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -qq --no-install-recommends \
            git cmake ninja-build make clang lld mold ccache patchelf curl \
            python3 pkg-config libncurses-dev libedit-dev \
            libxml2-dev uuid-dev libicu-dev \
            libblocksruntime-dev zlib1g-dev xz-utils file procps

          apt-get remove -y libpython3*-dev swig* || true
          mkdir -p ${{ env.INSTALL_PREFIX }} /dev/shm/ccache-tmp

          ln -sf /usr/bin/ld.lld /usr/bin/ld
          ln -sf /usr/bin/ld.lld /usr/bin/x86_64-linux-gnu-ld || true
          ln -sf /usr/bin/ld.lld /usr/bin/aarch64-linux-gnu-ld || true

          SWIFT_URL="https://download.swift.org/swift-${{ env.SWIFT_BOOTSTRAP_VER }}-release/ubuntu2604${{ matrix.swift_url_arch }}/swift-${{ env.SWIFT_BOOTSTRAP_VER }}-RELEASE/swift-${{ env.SWIFT_BOOTSTRAP_VER }}-RELEASE-ubuntu26.04${{ matrix.swift_dir_arch }}.tar.gz"
          mkdir -p /opt/swift-bootstrap
          echo "Baixando Swift bootstrap ${{ env.SWIFT_BOOTSTRAP_VER }} para Ubuntu 26.04 (${{ matrix.arch }})"
          curl --fail --location --show-error --silent --retry 3 "$SWIFT_URL" | tar -xz -C /opt/swift-bootstrap --strip-components=2
          /opt/swift-bootstrap/bin/swiftc --version
          /opt/swift-bootstrap/bin/swiftc --version | grep -F "${{ env.SWIFT_BOOTSTRAP_VER }}"
          rm -f /opt/swift-bootstrap/bin/clang* /opt/swift-bootstrap/bin/lld* /opt/swift-bootstrap/bin/ld* /opt/swift-bootstrap/bin/lldb*
          ln -sf /usr/bin/clang /opt/swift-bootstrap/bin/clang
          ln -sf /usr/bin/clang++ /opt/swift-bootstrap/bin/clang++
          ln -sf /usr/bin/ld.lld /opt/swift-bootstrap/bin/ld.lld
          ln -sf /usr/bin/ld.lld /opt/swift-bootstrap/bin/ld
          ln -sf /usr/bin/lld /opt/swift-bootstrap/bin/lld
          ln -sf /usr/bin/mold /opt/swift-bootstrap/bin/ld.mold

          # Verifica antecipadamente o bootstrap Swift usando o linker LLVM.
          # Usamos o Swift 6.4.1 nativo para Ubuntu 26.04 e forçamos LLVM LLD.
          printf 'print("Swift bootstrap LLD OK")\n' > /tmp/omnillvm-swift-bootstrap-test.swift
          /opt/swift-bootstrap/bin/swiftc -use-ld=lld \
            /tmp/omnillvm-swift-bootstrap-test.swift \
            -o /tmp/omnillvm-swift-bootstrap-test
          /tmp/omnillvm-swift-bootstrap-test
          rm -f /tmp/omnillvm-swift-bootstrap-test.swift /tmp/omnillvm-swift-bootstrap-test

          CORES=$(nproc --all)
          COMPILE_JOBS=$(( CORES + 2 ))
          RAM_GB=$(awk '/MemTotal/ {printf "%.0f", $2/1024/1024}' /proc/meminfo)
          LINK_JOBS=$CORES

          echo "Detectado: ${CORES} vCPUs (Compile Jobs: ${COMPILE_JOBS} | Link Jobs: ${LINK_JOBS}) | ${RAM_GB} GB RAM"
          echo "cores=$CORES" >> $GITHUB_OUTPUT
          echo "compile_jobs=$COMPILE_JOBS" >> $GITHUB_OUTPUT
          echo "link_jobs=$LINK_JOBS" >> $GITHUB_OUTPUT

      - name: 2. Cache ccache (Ubuntu 26.04 - ${{ matrix.arch }})
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: omnillvm-u2604-core-641-${{ matrix.arch }}
          restore-keys: |
            omnillvm-u2604-core-641-${{ matrix.arch }}
            omnillvm-u2604-core-${{ matrix.arch }}
          max-size: 4G

      - name: 3. Clonar Swift 6.4.1 + LLVM 21 + libdispatch (Sem Repositórios de Gerenciadores de Pacotes)
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/src && cd $GITHUB_WORKSPACE/src
          git clone --branch ${{ env.SWIFT_SCHEME }} --depth 1 --single-branch https://github.com/swiftlang/swift.git
          # Clona os fontes do compilador/LLVM/cmark sem baixar SwiftPM e o Swift Driver externo.
          # O build usará --skip-early-swift-driver e --skip-early-swiftsyntax.
          ./swift/utils/update-checkout --clone --scheme ${{ env.SWIFT_SCHEME }} --skip-history \
            --skip-repository swiftpm \
            --skip-repository swift-driver \
            --skip-repository swift-tools-support-core \
            --skip-repository swift-argument-parser \
            --skip-repository swift-crypto \
            --skip-repository swift-certificates \
            --skip-repository swift-asn1 \
            --skip-repository swift-system \
            --skip-repository swift-collections \
            --skip-repository yams \
            --skip-repository llbuild \
            --skip-repository indexstore-db \
            --skip-repository sourcekit-lsp \
            --skip-repository swift-docc \
            --skip-repository swift-docc-render-artifact \
            --skip-repository swift-docc-symbolkit \
            --skip-repository swift-markdown \
            --skip-repository swift-format \
            --skip-repository swift-testing \
            --skip-repository swift-foundation \
            --skip-repository swift-foundation-icu \
            --skip-repository swift-corelibs-foundation \
            --skip-repository swift-corelibs-xctest \
            -j ${{ steps.hw.outputs.compile_jobs }} || \
          ./swift/utils/update-checkout --clone --scheme ${{ env.SWIFT_SCHEME }} --skip-history -j ${{ steps.hw.outputs.compile_jobs }}

          # Garante que cmark (dependência do compilador Swift) esteja disponível.
          if [ ! -d "$GITHUB_WORKSPACE/src/cmark" ] && [ ! -d "$GITHUB_WORKSPACE/src/swift-cmark" ]; then
            ./swift/utils/update-checkout --clone --scheme ${{ env.SWIFT_SCHEME }} --skip-history -j ${{ steps.hw.outputs.compile_jobs }}
          fi
          # Não manter fontes de SwiftPM nem do Swift Driver externo.
          # O build-script é instruído explicitamente a NÃO executar earlyswiftdriver.
          rm -rf $GITHUB_WORKSPACE/src/swiftpm $GITHUB_WORKSPACE/src/swift-driver

      - name: 4. Compilar e Configurar Core 6.4.1 Completo na Origem (LLVM + Clang + Swiftc + LLDB + Runtimes)
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          cd $GITHUB_WORKSPACE/src

          export PATH="/usr/bin:/bin:/opt/swift-bootstrap/bin:$PATH"
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export CFLAGS="${{ env.MAX_OPT_FLAGS }}"
          export CXXFLAGS="${{ env.MAX_OPT_FLAGS }}"
          export TMPDIR="/tmp"

          BUILD_RPATH="\$ORIGIN/../lib:\$ORIGIN/../lib/swift/linux:\$ORIGIN"

          # 1. Ativa LinkDyLib = true nativamente no código-fonte C++ do llvm-config
          sed -i 's/bool LinkDyLib = .*;/bool LinkDyLib = true;/g' \
            $GITHUB_WORKSPACE/src/llvm-project/llvm/tools/llvm-config/llvm-config.cpp

          # 2. Usa vírgula (-Wl,--undefined-version,--version-script) nos version-scripts do Clang/LLVM para o ld.lld
          find $GITHUB_WORKSPACE/src/llvm-project -name "CMakeLists.txt" -o -name "*.cmake" | \
            xargs grep -l "version-script" 2>/dev/null | \
            xargs sed -i 's/-Wl,--version-script/-Wl,--undefined-version,--version-script/g' 2>/dev/null || true

          # Estas opções impedem que build-script procure o executável ausente
          # swift-driver/Utilities/build-script-helper.py (erro "earlyswiftdriver").
          # swift-syntax foi omitido intencionalmente e SwiftMacros nao sera gerado.
          # Desative apenas o backtrace auxiliar, mantendo stdlib e compilador.
          ./swift/utils/build-script \
            --release \
            --skip-early-swift-driver \
            --skip-early-swiftsyntax \
            --no-assertions \
            --no-swift-stdlib-assertions \
            --bootstrapping=hosttools \
            --host-cc=/usr/bin/clang \
            --host-cxx=/usr/bin/clang++ \
            --libdispatch \
            --lldb \
            --jobs ${{ steps.hw.outputs.compile_jobs }} \
            --install-all \
            --install-destdir="${{ env.INSTALL_PREFIX }}" \
            --install-prefix="/usr" \
            --cross-compile-append-host-target-to-destdir=False \
            --extra-cmake-options="\
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_C_FLAGS_RELEASE='${{ env.MAX_OPT_FLAGS }}' \
              -DCMAKE_CXX_FLAGS_RELEASE='${{ env.MAX_OPT_FLAGS }}' \
              -DCMAKE_INSTALL_RPATH='${BUILD_RPATH}' \
              -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
              -DLLVM_TARGETS_TO_BUILD='X86;AArch64;RISCV' \
              -DLLVM_ENABLE_PROJECTS='clang;clang-tools-extra;lld' \
              -DLLVM_ENABLE_RUNTIMES='compiler-rt;libcxx;libcxxabi;libunwind' \
              -DCOMPILER_RT_BUILD_SANITIZERS=OFF \
              -DCOMPILER_RT_BUILD_XRAY=OFF \
              -DCOMPILER_RT_BUILD_MEMPROF=OFF \
              -DCOMPILER_RT_BUILD_LIBFUZZER=OFF \
              -DCOMPILER_RT_BUILD_PROFILE=OFF \
              -DLIBCXX_ENABLE_STATIC=OFF \
              -DLIBCXX_HAS_ATOMIC_LIB=OFF \
              -DLIBCXXABI_ENABLE_STATIC=OFF \
              -DLIBUNWIND_ENABLE_STATIC=OFF \
              -DSWIFT_BUILD_STATIC_STDLIB=OFF \
              -DSWIFT_BUILD_STATIC_SDK_OVERLAY=OFF \
              -DSWIFT_ENABLE_BACKTRACING=OFF \
              -DLLVM_USE_LINKER=lld \
              -DSWIFT_USE_LINKER=lld \
              -DSWIFT_ENABLE_LLD_LINKER=ON \
              -DSWIFT_ENABLE_GOLD_LINKER=OFF \
              -DCMAKE_Swift_FLAGS=-use-ld=lld \
              -DLLVM_PARALLEL_COMPILE_JOBS=${{ steps.hw.outputs.compile_jobs }} \
              -DLLVM_PARALLEL_LINK_JOBS=${{ steps.hw.outputs.link_jobs }} \
              -DLLVM_BUILD_LLVM_DYLIB=ON \
              -DLLVM_LINK_LLVM_DYLIB=OFF \
              -DCLANG_LINK_CLANG_DYLIB=OFF \
              -DLLVM_INSTALL_UTILS=ON \
              -DLLVM_ENABLE_LIBXML2=OFF \
              -DLLVM_ENABLE_ZSTD=OFF \
              -DLLVM_ENABLE_ZLIB=ON \
              -DLLDB_INCLUDE_TESTS=OFF \
              -DLLDB_ENABLE_SWIG=OFF \
              -DLLDB_ENABLE_PYTHON=OFF \
              -DLLDB_ENABLE_LUA=OFF \
              -DLLDB_ENABLE_LZMA=OFF \
              -DLLDB_ENABLE_LIBXML2=OFF \
              -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_BENCHMARKS=OFF \
              -DLLVM_ENABLE_BINDINGS=OFF"

          LLVM_BUILD_DIR=$(find $GITHUB_WORKSPACE/src/build -maxdepth 2 -type d -name "llvm-linux-*" | head -n 1)
          SWIFT_BUILD_DIR=$(find $GITHUB_WORKSPACE/src/build -maxdepth 2 -type d -name "swift-linux-*" | head -n 1)
          LLDB_BUILD_DIR=$(find $GITHUB_WORKSPACE/src/build -maxdepth 2 -type d -name "lldb-linux-*" | head -n 1)
          DISPATCH_BUILD_DIR=$(find $GITHUB_WORKSPACE/src/build -maxdepth 2 -type d -name "libdispatch-linux-*" | head -n 1)

          sed -i 's/#define LLVM_ENABLE_DYLIB 0/#define LLVM_ENABLE_DYLIB 1/g' \
            "$LLVM_BUILD_DIR/tools/llvm-config/BuildVariables.inc" || true

          ninja -C "$LLVM_BUILD_DIR" -j ${{ steps.hw.outputs.compile_jobs }} LLVM clang-cpp FileCheck llvm-config
          DESTDIR="${{ env.INSTALL_PREFIX }}" ninja -C "$LLVM_BUILD_DIR" install
          if [ -d "$LLVM_BUILD_DIR/runtimes/runtimes-bins" ]; then
            DESTDIR="${{ env.INSTALL_PREFIX }}" ninja -C "$LLVM_BUILD_DIR/runtimes/runtimes-bins" install || true
          fi
          if [ -n "$DISPATCH_BUILD_DIR" ]; then DESTDIR="${{ env.INSTALL_PREFIX }}" ninja -C "$DISPATCH_BUILD_DIR" install || true; fi
          if [ -n "$SWIFT_BUILD_DIR" ]; then DESTDIR="${{ env.INSTALL_PREFIX }}" ninja -C "$SWIFT_BUILD_DIR" install || true; fi
          if [ -n "$LLDB_BUILD_DIR" ]; then DESTDIR="${{ env.INSTALL_PREFIX }}" ninja -C "$LLDB_BUILD_DIR" install || true; fi

          rm -rf /opt/swift-bootstrap

          TOOLCHAIN="${{ env.INSTALL_PREFIX }}"
          for sub in usr/local usr local linux-x86_64 linux-aarch64; do
            if [ -d "$TOOLCHAIN/$sub" ]; then
              cp -af "$TOOLCHAIN/$sub/"* "$TOOLCHAIN/" 2>/dev/null || true
              rm -rf "$TOOLCHAIN/$sub"
            fi
          done

          mkdir -p "$TOOLCHAIN/bin" "$TOOLCHAIN/include" "$TOOLCHAIN/lib"

          # 3. Configura swift e swiftc diretamente sobre o swift-frontend (Zero dependência de SwiftPM / swift-driver externo!)
          rm -f "$TOOLCHAIN/bin/swift-package"* "$TOOLCHAIN/bin/swift-build"* \
                "$TOOLCHAIN/bin/swift-test"* "$TOOLCHAIN/bin/swift-run"* \
                "$TOOLCHAIN/bin/swift-sdk"* "$TOOLCHAIN/bin/swift-experimental"* \
                "$TOOLCHAIN/bin/swift-driver"* "$TOOLCHAIN/bin/swift-help"* 2>/dev/null || true
          ln -sf swift-frontend "$TOOLCHAIN/bin/swift"
          ln -sf swift-frontend "$TOOLCHAIN/bin/swiftc"
          ln -sf swift-frontend "$TOOLCHAIN/bin/swift-symbolgraph-extract"
          ln -sf swift-frontend "$TOOLCHAIN/bin/swift-autolink-extract"
          ln -sf swift-frontend "$TOOLCHAIN/bin/swift-api-digester"

          cp -af "$LLVM_BUILD_DIR/lib/libLLVM"*".so"* "$TOOLCHAIN/lib/"
          cp -af "$LLVM_BUILD_DIR/lib/libclang"*".so"* "$TOOLCHAIN/lib/" || true
          cp -af "$LLVM_BUILD_DIR/bin/clang"* "$TOOLCHAIN/bin/"
          cp -f "$LLVM_BUILD_DIR/bin/llvm-config" "$TOOLCHAIN/bin/"
          cp -f "$LLVM_BUILD_DIR/bin/FileCheck" "$TOOLCHAIN/bin/" || true
          cp -f "$LLVM_BUILD_DIR/bin/llvm-tblgen" "$TOOLCHAIN/bin/" || true
          cp -f "$LLVM_BUILD_DIR/bin/clang-tblgen" "$TOOLCHAIN/bin/" || true
          cp -f "$LLVM_BUILD_DIR/bin/lld" "$TOOLCHAIN/bin/" || true
          ln -sf lld "$TOOLCHAIN/bin/ld.lld" || true
          ln -sf clang "$TOOLCHAIN/bin/clang++" || true
          cp -ru "$LLVM_BUILD_DIR/include/"* "$TOOLCHAIN/include/" 2>/dev/null || true
          cp -ru "$GITHUB_WORKSPACE/src/llvm-project/llvm/include/"* "$TOOLCHAIN/include/" 2>/dev/null || true
          cp -ru "$LLVM_BUILD_DIR/lib/cmake" "$TOOLCHAIN/lib/" 2>/dev/null || true

          # 4. Garante headers completos da libc++ (incluindo __config_site) em include/c++/v1
          CFG_SITE=$(find "$TOOLCHAIN/include" "$LLVM_BUILD_DIR" -name "__config_site" 2>/dev/null | head -n 1)
          if [ -n "$CFG_SITE" ] && [ -d "$TOOLCHAIN/include/c++/v1" ]; then
            cp -af "$CFG_SITE" "$TOOLCHAIN/include/c++/v1/__config_site" 2>/dev/null || true
          fi

          # 5. Expõe todas as bibliotecas .so do Swift e dos Runtimes LLVM diretamente em $TOOLCHAIN/lib
          find "$TOOLCHAIN/lib/swift" -name "*.so*" 2>/dev/null | while read -r f; do
            if [ ! -e "$TOOLCHAIN/lib/$(basename "$f")" ]; then
              ln -sf "$f" "$TOOLCHAIN/lib/$(basename "$f")" 2>/dev/null || true
            fi
          done
          find "$TOOLCHAIN/lib" -maxdepth 3 \( -name "libc++.so*" -o -name "libc++abi.so*" -o -name "libunwind.so*" \) | while read -r f; do
            if [ "$(dirname "$f")" != "$TOOLCHAIN/lib" ]; then
              ln -sf "$f" "$TOOLCHAIN/lib/$(basename "$f")" 2>/dev/null || true
            fi
          done

          # 6. Limpa '-latomic' dos linker scripts libc++.so e gera libatomic.so.1 ELF nativa a partir do compiler-rt
          find "$TOOLCHAIN/lib" -name "libc++.so" -type f -exec sed -i 's/-latomic//g' {} + 2>/dev/null || true
          find "$TOOLCHAIN/lib" -maxdepth 4 -type f -name "*.so*" ! -name "libatomic.so*" -exec patchelf --remove-needed libatomic.so.1 {} + 2>/dev/null || true

          BUILTINS_A=$(find "$TOOLCHAIN" -name "libclang_rt.builtins*.a" | head -n 1)
          if [ -n "$BUILTINS_A" ]; then
            "$TOOLCHAIN/bin/clang" -shared -fuse-ld=lld -nostdlib \
              -Wl,-soname,libatomic.so.1 \
              -Wl,--whole-archive "$BUILTINS_A" -Wl,--no-whole-archive \
              -lc -o "$TOOLCHAIN/lib/libatomic.so.1"
            ln -sf libatomic.so.1 "$TOOLCHAIN/lib/libatomic.so"
          fi

          # 7. Remove bibliotecas estáticas internas (.a) e documentações desnecessárias já no Stage 1!
          rm -rf "$TOOLCHAIN/lib/swift_static" "$TOOLCHAIN/share/doc" "$TOOLCHAIN/share/man" "$TOOLCHAIN/share/info" 2>/dev/null || true
          rm -f "$TOOLCHAIN/lib"/libLLVM*.a "$TOOLCHAIN/lib"/libclang*.a \
                "$TOOLCHAIN/lib"/liblldb*.a "$TOOLCHAIN/lib"/liblld*.a 2>/dev/null || true

          ln -sfn . "$TOOLCHAIN/usr"

          "$TOOLCHAIN/bin/llvm-config" --link-shared --libs x86 aarch64 riscv
          ls -la "$TOOLCHAIN/bin/clang" "$TOOLCHAIN/bin/llvm-config" "$TOOLCHAIN/bin/FileCheck"

      - name: 5. Empacotar Core SDK (${{ matrix.arch }})
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          cd /opt
          tar -I "zstd -1 -T0" -cf $GITHUB_WORKSPACE/core-sdk-${{ matrix.arch }}.tar.zst omnillvm

      - name: 6. Salvar Cache do Core SDK Pronto (Stage 1 - ${{ matrix.arch }})
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: core-sdk-${{ matrix.arch }}.tar.zst
          key: omnillvm-core-${{ env.CORE_CACHE_REV }}-${{ matrix.arch }}

      - name: Upload Core SDK (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: core-sdk-${{ matrix.arch }}
          path: core-sdk-${{ matrix.arch }}.tar.zst
          compression-level: 0
          retention-days: 1

  # ============================================================================
  # ESTÁGIO 2: Matrix 3x2 Real (6 Jobs em Paralelo: Flang+flang-rt, Ada e Rustc x AMD64/ARM64)
  # ============================================================================
  build-parallel-frontends:
    name: "Stage 2: ${{ matrix.component }} [Ubuntu 26.04 - ${{ matrix.arch }}]"
    needs: build-core
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
      # /tmp precisa permitir execucao: o Swift/CMake cria e executa binarios de teste ali.
      options: --privileged -v /opt:/opt --shm-size=8g --tmpfs /tmp:rw,exec,nosuid,size=6g,mode=1777
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        component: [flang-mlir, gnat-ada, rust]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
            rust_triple: x86_64-unknown-linux-gnu
            gnu_triple: x86_64-linux-gnu
          - arch: arm64
            runner: ubuntu-26.04-arm
            rust_triple: aarch64-unknown-linux-gnu
            gnu_triple: aarch64-linux-gnu

    steps:
      - name: 0A. Preparar ZSTD para o Cache do GitHub no Ubuntu 26.04
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends zstd ca-certificates tar

      - name: Checkout
        uses: actions/checkout@v4

      - name: 0B. Restaurar Cache do Overlay Pronto (${{ matrix.component }}-${{ matrix.arch }})
        id: overlay-cache
        if: inputs.rebuild_frontends != 'true'
        uses: actions/cache/restore@v4
        with:
          path: overlay-${{ matrix.component }}-${{ matrix.arch }}.tar.zst
          key: omnillvm-overlay-tarball-${{ env.FRONTEND_CACHE_REV }}-${{ matrix.component }}-${{ matrix.arch }}
          restore-keys: |
            omnillvm-overlay-tarball-${{ env.FRONTEND_CACHE_REV }}-${{ matrix.component }}-${{ matrix.arch }}

      - name: 1. Baixar Core SDK (${{ matrix.arch }})
        if: steps.overlay-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: core-sdk-${{ matrix.arch }}

      - name: Extrair Core SDK e Configurar CPUs/RAM no Ubuntu 26.04
        id: hw
        if: steps.overlay-cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -qq --no-install-recommends curl git xz-utils procps

          CORES=$(nproc --all)
          COMPILE_JOBS=$(( CORES + 2 ))
          echo "cores=$CORES" >> $GITHUB_OUTPUT
          echo "compile_jobs=$COMPILE_JOBS" >> $GITHUB_OUTPUT
          echo "link_jobs=$CORES" >> $GITHUB_OUTPUT

          mkdir -p /opt /opt/overlay-install /dev/shm/ccache-tmp
          tar -I "zstd -T0" -xf core-sdk-${{ matrix.arch }}.tar.zst -C /opt/
          rm -f core-sdk-${{ matrix.arch }}.tar.zst

          ln -sfn . "${{ env.INSTALL_PREFIX }}/usr"
          "${{ env.INSTALL_PREFIX }}/bin/llvm-config" --link-shared --libs --system-libs x86 aarch64 riscv

      - name: 2. Cache ccache (${{ matrix.component }}-${{ matrix.arch }})
        if: steps.overlay-cache.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: omnillvm-u2604-641-${{ matrix.component }}-${{ matrix.arch }}
          restore-keys: |
            omnillvm-u2604-641-${{ matrix.component }}-${{ matrix.arch }}
            omnillvm-u2604-${{ matrix.component }}-${{ matrix.arch }}
          max-size: 2G

      # --- 3A. Flang + MLIR + flang-rt (Suporte Completo a Fortran Standalone + Zero libquadmath) ---
      - name: 3A. Compilar Flang + MLIR + flang-rt (Shared libLLVM.so + Zero libquadmath)
        if: matrix.component == 'flang-mlir' && steps.overlay-cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -qq --no-install-recommends cmake ninja-build make clang lld mold ccache python3 zlib1g-dev patchelf

          export TMPDIR="/tmp"

          mkdir -p $GITHUB_WORKSPACE/flang-src && cd $GITHUB_WORKSPACE/flang-src
          git clone --filter=blob:none --no-checkout --depth 1 --branch ${{ env.SWIFT_LLVM_BRANCH }} https://github.com/swiftlang/llvm-project.git
          cd llvm-project
          git sparse-checkout init --cone
          git sparse-checkout set cmake llvm mlir flang clang third-party runtimes flang-rt compiler-rt
          git checkout

          # 1. Desativa permanentemente a detecção de libquadmath.so.0 do GCC no Flang e no flang-rt!
          find flang flang-rt -name "CMakeLists.txt" -o -name "*.cmake" 2>/dev/null | \
            xargs sed -i 's/check_library_exists(quadmath.*/set(HAVE_LIBQUADMATH OFF)/g; s/check_include_file(quadmath.h.*/set(HAVE_QUADMATH_H OFF)/g' 2>/dev/null || true

          # 2. Compila Flang + MLIR + flang-rt (CENÁRIO A: Habilita libflang_rt.runtime.a para programas 100% Fortran standalone!)
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="${{ env.MAX_OPT_FLAGS }}" \
            -DCMAKE_CXX_FLAGS_RELEASE="${{ env.MAX_OPT_FLAGS }}" \
            -DCMAKE_INSTALL_PREFIX="/opt/overlay-install" \
            -DCMAKE_INSTALL_RPATH="\$ORIGIN/../lib:\$ORIGIN" \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=mold -Wl,--undefined-version" \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=mold -Wl,--undefined-version" \
            -DCMAKE_C_COMPILER="/usr/bin/clang" \
            -DCMAKE_CXX_COMPILER="/usr/bin/clang++" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_VERSION_MAJOR=21 \
            -DLLVM_VERSION_MINOR=0 \
            -DLLVM_VERSION_PATCH=0 \
            -DCLANG_VERSION_MAJOR=21 \
            -DCLANG_VERSION_MINOR=0 \
            -DCLANG_VERSION_PATCH=0 \
            -DHAVE_LIBQUADMATH=OFF \
            -DHAVE_QUADMATH_H=OFF \
            -DFLANG_RUNTIME_F128_MATH_LIB="" \
            -DFLANG_RT_ENABLE_SHARED=ON \
            -DFLANG_RT_ENABLE_STATIC=ON \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;RISCV" \
            -DLLVM_ENABLE_PROJECTS="clang;mlir;flang" \
            -DLLVM_ENABLE_RUNTIMES="flang-rt" \
            -DFLANG_ENABLE_FLANG_RT=ON \
            -DLLVM_USE_LINKER=mold \
            -DLLVM_PARALLEL_COMPILE_JOBS=${{ steps.hw.outputs.compile_jobs }} \
            -DLLVM_PARALLEL_LINK_JOBS=${{ steps.hw.outputs.link_jobs }} \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCLANG_LINK_CLANG_DYLIB=OFF \
            -DMLIR_BUILD_MLIR_C_DYLIB=ON \
            -DMLIR_LINK_MLIR_DYLIB=ON \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DFLANG_INCLUDE_TESTS=OFF \
            -DMLIR_INCLUDE_TESTS=OFF

          ninja -C build -j ${{ steps.hw.outputs.compile_jobs }} tools/flang/install
          ninja -C build -j ${{ steps.hw.outputs.compile_jobs }} runtimes || true
          if [ -d "build/runtimes/runtimes-bins" ]; then
            ninja -C build/runtimes/runtimes-bins install || true
          fi

          mkdir -p /opt/overlay-install/lib
          cp -a build/lib/libFortran* "/opt/overlay-install/lib/" 2>/dev/null || true
          cp -a build/lib/libMLIR* "/opt/overlay-install/lib/" 2>/dev/null || true
          cp -a build/lib/libflang* "/opt/overlay-install/lib/" 2>/dev/null || true

          # Copia libflang_rt.runtime.a e .so para /opt/overlay-install/lib e para o resource-dir do Clang/Flang (lib/clang/21/lib/...)
          find build -name "libflang_rt*" -o -name "libFortran*" | while read -r rtfile; do
            cp -af "$rtfile" /opt/overlay-install/lib/ 2>/dev/null || true
            mkdir -p "/opt/overlay-install/lib/clang/21/lib/${{ matrix.rust_triple }}" "/opt/overlay-install/lib/clang/21/lib/linux"
            cp -af "$rtfile" "/opt/overlay-install/lib/clang/21/lib/${{ matrix.rust_triple }}/" 2>/dev/null || true
            cp -af "$rtfile" "/opt/overlay-install/lib/clang/21/lib/linux/" 2>/dev/null || true
          done

          # Remove apenas as bibliotecas estáticas internas do compilador (preservando libflang_rt.runtime.a e libFortran*.a!)
          rm -f /opt/overlay-install/lib/libLLVM*.a \
                /opt/overlay-install/lib/libclang*.a \
                /opt/overlay-install/lib/libMLIR*.a \
                /opt/overlay-install/lib/libflang*.a
          rm -rf /opt/overlay-install/share/doc /opt/overlay-install/share/man 2>/dev/null || true

      # --- 3B. GNAT-LLVM (Ada) [release/27.1 Fixo Estável para LLVM 21] ---
      - name: 3B. Compilar GNAT-LLVM 27.1 Dinâmico (Shared libLLVM.so + RTS v16 Completa na Origem)
        if: matrix.component == 'gnat-ada' && steps.overlay-cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -qq --no-install-recommends make build-essential gprbuild cmake ninja-build clang lld mold ccache python3 zlib1g-dev
          apt-get install -y -qq --no-install-recommends gnat-15 gcc-15 g++-15 || apt-get install -y -qq --no-install-recommends gnat

          if [ -x /usr/bin/gnat-15 ]; then
            GNAT_VER=15
          else
            GNAT_VER=14
          fi
          ln -sf /usr/bin/gcc-${GNAT_VER} /usr/bin/gcc
          ln -sf /usr/bin/g++-${GNAT_VER} /usr/bin/g++
          ln -sf /usr/bin/gnat-${GNAT_VER} /usr/bin/gnat
          ln -sf /usr/bin/gnatmake-${GNAT_VER} /usr/bin/gnatmake
          ln -sf /usr/bin/gnatbind-${GNAT_VER} /usr/bin/gnatbind
          ln -sf /usr/bin/gnatlink-${GNAT_VER} /usr/bin/gnatlink
          ln -sf /usr/bin/ld.lld /usr/bin/ld
          ln -sf /usr/bin/ld.lld /usr/bin/aarch64-linux-gnu-ld || true
          ln -sf /usr/bin/ld.lld /usr/bin/x86_64-linux-gnu-ld || true

          LLVM_SO=$(ls "${{ env.INSTALL_PREFIX }}/lib/"libLLVM-*.so "${{ env.INSTALL_PREFIX }}/lib/"libLLVM.so.* 2>/dev/null | head -n 1)
          if [ -n "$LLVM_SO" ] && [ ! -e "${{ env.INSTALL_PREFIX }}/lib/libLLVM.so" ]; then
            ln -sf "$(basename "$LLVM_SO")" "${{ env.INSTALL_PREFIX }}/lib/libLLVM.so"
          fi

          export PATH="${{ env.INSTALL_PREFIX }}/bin:$PATH"
          export LD_LIBRARY_PATH="${{ env.INSTALL_PREFIX }}/lib:$LD_LIBRARY_PATH"
          export TMPDIR="/tmp"

          mkdir -p $GITHUB_WORKSPACE/ada && cd $GITHUB_WORKSPACE/ada
          git clone --depth 1 --branch ${{ env.GNAT_LLVM_BRANCH }} https://github.com/AdaCore/gnat-llvm.git
          cd gnat-llvm
          if git ls-remote --exit-code --heads https://github.com/AdaCore/llvm-bindings.git "${{ env.GNAT_LLVM_BRANCH }}" >/dev/null 2>&1; then
            git clone --depth 1 --branch ${{ env.GNAT_LLVM_BRANCH }} https://github.com/AdaCore/llvm-bindings.git
          else
            git clone --depth 1 https://github.com/AdaCore/llvm-bindings.git
          fi

          if git ls-remote --exit-code --heads https://gcc.gnu.org/git/gcc.git "${{ env.GCC_ADA_BRANCH }}" >/dev/null 2>&1; then
            git clone --filter=blob:none --no-checkout --depth 1 --branch "${{ env.GCC_ADA_BRANCH }}" https://gcc.gnu.org/git/gcc.git llvm-interface/gcc
          else
            git clone --filter=blob:none --no-checkout --depth 1 https://gcc.gnu.org/git/gcc.git llvm-interface/gcc
          fi
          cd llvm-interface/gcc && git sparse-checkout init --cone && git sparse-checkout set gcc/ada include && git checkout && cd ../..
          ln -s gcc/gcc/ada llvm-interface/gnat_src

          if ! grep -q "procedure Clear" llvm-interface/gnat_src/table.ads; then
            sed -i 's/procedure Init;/procedure Init;\n      procedure Clear renames Init;/' llvm-interface/gnat_src/table.ads
          fi

          python3 - << 'EOF'
          p = "llvm-interface/gnat_src/gnatlink.adb"
          with open(p, "r") as f:
              txt = f.read()
          if "use type System.CRTL.long;" not in txt:
              txt = txt.replace("procedure Gnatlink is", "with System.CRTL; use System.CRTL;\nprocedure Gnatlink is\n   use type System.CRTL.long;", 1)
          with open(p, "w") as f:
              f.write(txt)
          EOF

          sed -i 's/"-Werror"/"-Wno-error"/g' llvm-interface/*.gpr 2>/dev/null || true
          sed -i 's/"-gnatg"/"-gnatg", "-gnatwn"/g' llvm-interface/*.gpr 2>/dev/null || true
          sed -i 's/--libs/--link-shared --libs/g' llvm-interface/Makefile || true

          make -C llvm-interface -j${{ steps.hw.outputs.compile_jobs }} \
            GPRBUILD_OPTIONS="-j${{ steps.hw.outputs.compile_jobs }} -cargs:Ada -gnatwn -cargs:C++ -Wno-error -largs -fuse-ld=lld -L${{ env.INSTALL_PREFIX }}/lib" \
            LLVM_CONFIG="${{ env.INSTALL_PREFIX }}/bin/llvm-config" \
            PREFIX="/opt/overlay-install" \
            build

          # CONFIGURAÇÃO PERMANENTE E COMPLETA DA RTS DO ADA NO STAGE 2:
          mkdir -p /opt/overlay-install/bin /opt/overlay-install/lib/rts-native/adalib /opt/overlay-install/lib/rts-native/adainclude
          cp -af llvm-interface/bin/* /opt/overlay-install/bin/
          ADA_LIB_DIR=$(dirname $(gcc-${GNAT_VER} -print-file-name=adalib/libgnat.a))
          ADA_INC_DIR=$(dirname $(gcc-${GNAT_VER} -print-file-name=adainclude/system.ads))
          cp -af "$ADA_LIB_DIR/"*.ali /opt/overlay-install/lib/rts-native/adalib/ 2>/dev/null || true
          sed -i '1s/GNAT Lib v15/GNAT Lib v16/' /opt/overlay-install/lib/rts-native/adalib/*.ali 2>/dev/null || true
          cp -af "$ADA_INC_DIR/"* /opt/overlay-install/lib/rts-native/adainclude/ 2>/dev/null || true

          ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnat-${GNAT_VER}.so" /opt/overlay-install/lib/rts-native/adalib/libgnat.so
          ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnat-${GNAT_VER}.so" /opt/overlay-install/lib/rts-native/adalib/libgnat-${GNAT_VER}.so
          ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnarl-${GNAT_VER}.so" /opt/overlay-install/lib/rts-native/adalib/libgnarl.so
          ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnarl-${GNAT_VER}.so" /opt/overlay-install/lib/rts-native/adalib/libgnarl-${GNAT_VER}.so
          ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnat-${GNAT_VER}.so" /opt/overlay-install/lib/libgnat.so
          ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnat-${GNAT_VER}.so" /opt/overlay-install/lib/libgnat-${GNAT_VER}.so
          ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnarl-${GNAT_VER}.so" /opt/overlay-install/lib/libgnarl.so
          ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnarl-${GNAT_VER}.so" /opt/overlay-install/lib/libgnarl-${GNAT_VER}.so

          ln -sfn lib/rts-native /opt/overlay-install/rts-native
          ln -sfn rts-native/adainclude /opt/overlay-install/lib/adainclude
          ln -sfn rts-native/adalib /opt/overlay-install/lib/adalib
          ln -sfn lib/rts-native/adainclude /opt/overlay-install/adainclude
          ln -sfn lib/rts-native/adalib /opt/overlay-install/adalib
          ls -la /opt/overlay-install/bin/

      # --- 3C. Apenas Rustc 1.94.0 + Stdlib Dinâmicos (ZERO Cargo / ZERO Package Manager!) ---
      - name: 3C. Compilar Apenas Rustc 1.94.0 + Stdlib (Sem Cargo + link-shared = true + mold)
        if: matrix.component == 'rust' && steps.overlay-cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -qq --no-install-recommends make build-essential cmake ninja-build clang mold lld ccache python3 curl pkg-config zlib1g-dev

          export PATH="${{ env.INSTALL_PREFIX }}/bin:$PATH"
          export LD_LIBRARY_PATH="${{ env.INSTALL_PREFIX }}/lib:$LD_LIBRARY_PATH"
          export TMPDIR="/tmp"
          export RUSTFLAGS="-C link-arg=-fuse-ld=mold -C link-arg=-L${{ env.INSTALL_PREFIX }}/lib"

          mkdir -p $GITHUB_WORKSPACE/rust-src && cd $GITHUB_WORKSPACE/rust-src
          git clone --depth 1 --branch ${{ env.RUST_BRANCH }} https://github.com/rust-lang/rust.git
          cd rust

          if ! grep -q "FileSystem" "${{ env.INSTALL_PREFIX }}/include/llvm/Support/PGOOptions.h"; then
            sed -i 's/"", "", "", FS,/"", "", "",/g' compiler/rustc_llvm/llvm-wrapper/PassWrapper.cpp || true
          fi

          # extended = false e tools = [] garante que APENAS o compilador rustc e a libstd sejam compilados
          # (Zero compilação do Cargo ou qualquer gerenciador de pacotes externo!)
          cat <<EOF > bootstrap.toml
          change-id = "ignore"

          [llvm]
          download-ci-llvm = false
          link-shared = true
          tests = false

          [build]
          build = "${{ matrix.rust_triple }}"
          host = ["${{ matrix.rust_triple }}"]
          target = ["${{ matrix.rust_triple }}"]
          jobs = ${{ steps.hw.outputs.compile_jobs }}
          docs = false
          compiler-docs = false
          extended = false
          tools = []
          ccache = "ccache"

          [install]
          prefix = "/opt/overlay-install"

          [rust]
          optimize = true
          lld = false
          debug = false
          debug-assertions = false
          debuginfo-level = 0
          debuginfo-level-std = 1
          codegen-units = ${{ steps.hw.outputs.cores }}
          rpath = true

          [target.${{ matrix.rust_triple }}]
          llvm-config = "${{ env.INSTALL_PREFIX }}/bin/llvm-config"
          llvm-filecheck = "${{ env.INSTALL_PREFIX }}/bin/FileCheck"
          cc = "${{ env.INSTALL_PREFIX }}/bin/clang"
          cxx = "${{ env.INSTALL_PREFIX }}/bin/clang++"
          linker = "${{ env.INSTALL_PREFIX }}/bin/clang"
          EOF

          python3 ./x.py build --stage 1 -j ${{ steps.hw.outputs.compile_jobs }}
          python3 ./x.py install
          rm -rf /opt/overlay-install/share/doc /opt/overlay-install/share/man

      - name: 4. Empacotar Overlay (${{ matrix.component }}-${{ matrix.arch }})
        if: steps.overlay-cache.outputs.cache-hit != 'true'
        run: |
          cd /opt/overlay-install
          tar -I "zstd -1 -T0" -cf $GITHUB_WORKSPACE/overlay-${{ matrix.component }}-${{ matrix.arch }}.tar.zst .

      - name: 5. Salvar Cache do Overlay Pronto (${{ matrix.component }}-${{ matrix.arch }})
        if: steps.overlay-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: overlay-${{ matrix.component }}-${{ matrix.arch }}.tar.zst
          key: omnillvm-overlay-tarball-${{ env.FRONTEND_CACHE_REV }}-${{ matrix.component }}-${{ matrix.arch }}

      - name: Upload do Overlay (${{ matrix.component }}-${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: overlay-${{ matrix.component }}-${{ matrix.arch }}
          path: overlay-${{ matrix.component }}-${{ matrix.arch }}.tar.zst
          compression-level: 0
          retention-days: 1

  # ============================================================================
  # ESTÁGIO 3: Fusão Limpa, RPATH ($ORIGIN), Deduplicação, Strip e Suíte de Testes
  # ============================================================================
  package-arch:
    name: "Stage 3: Merge, Strip & Tests [Ubuntu 26.04 - ${{ matrix.arch }}]"
    needs: [build-core, build-parallel-frontends]
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
      options: --privileged -v /opt:/opt
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
            gnu_triple: x86_64-linux-gnu
          - arch: arm64
            runner: ubuntu-26.04-arm
            gnu_triple: aarch64-linux-gnu

    steps:
      - name: 0A. Preparar ZSTD para o Cache do GitHub no Ubuntu 26.04
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends zstd ca-certificates tar

      - name: Checkout
        uses: actions/checkout@v4

      - name: 0B. Restaurar Cache do Pacote Final Pronto (Stage 3 - ${{ matrix.arch }})
        id: pkg-cache
        if: inputs.rebuild_package != 'true' && inputs.rebuild_frontends != 'true' && inputs.rebuild_core != 'true'
        uses: actions/cache/restore@v4
        with:
          path: omnillvm-toolchain-ubuntu26.04-${{ matrix.arch }}.tar.zst
          key: omnillvm-final-pkg-${{ env.PACKAGE_CACHE_REV }}-${{ env.CORE_CACHE_REV }}-${{ env.FRONTEND_CACHE_REV }}-${{ matrix.arch }}

      - name: Baixar Artefatos (${{ matrix.arch }})
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ matrix.arch }}"
          path: artifacts

      - name: 1. Unificar Árvore, Ativar clang.cfg Pure LLVM, Deduplicar e Aplicar Strip Cirúrgico
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -qq --no-install-recommends patchelf rdfind symlinks file findutils

          CORES=$(nproc --all)
          mkdir -p /opt

          # 1. Extrai a Base (Stage 1) e os 3 Overlays (Stage 2) na mesma árvore
          tar -I "zstd -T0" -xf artifacts/core-sdk-${{ matrix.arch }}/core-sdk-${{ matrix.arch }}.tar.zst -C /opt/
          rm -f "${{ env.INSTALL_PREFIX }}/usr" || true
          for comp in flang-mlir gnat-ada rust; do
            tar -I "zstd -T0" -xf artifacts/overlay-${comp}-${{ matrix.arch }}/overlay-${comp}-${{ matrix.arch }}.tar.zst -C "${{ env.INSTALL_PREFIX }}/"
          done
          rm -rf artifacts

          TOOLCHAIN="${{ env.INSTALL_PREFIX }}"
          STRIP="$TOOLCHAIN/bin/llvm-strip"

          # Garante que nenhum binário de gerenciador de pacotes (cargo, swift-package, etc.) exista na árvore final
          rm -f "$TOOLCHAIN/bin/cargo"* "$TOOLCHAIN/bin/swift-package"* \
                "$TOOLCHAIN/bin/swift-build"* "$TOOLCHAIN/bin/swift-test"* \
                "$TOOLCHAIN/bin/swift-run"* "$TOOLCHAIN/bin/swift-sdk"* 2>/dev/null || true

          # 2. Ativa os symlinks finais do compiler-rt/libunwind e clang.cfg/clang++.cfg para distribuição Pure LLVM
          CRTBEGIN_FILE=$(find "$TOOLCHAIN" -name "clang_rt.crtbegin*.o" | head -n 1)
          if [ -n "$CRTBEGIN_FILE" ]; then
            CRT_DIR=$(dirname "$CRTBEGIN_FILE")
            ln -sf "$CRT_DIR"/clang_rt.crtbegin*.o "$TOOLCHAIN/lib/crtbegin.o" 2>/dev/null || true
            ln -sf "$CRT_DIR"/clang_rt.crtbeginS*.o "$TOOLCHAIN/lib/crtbeginS.o" 2>/dev/null || true
            ln -sf "$CRT_DIR"/clang_rt.crtbeginT*.o "$TOOLCHAIN/lib/crtbeginT.o" 2>/dev/null || true
            ln -sf "$CRT_DIR"/clang_rt.crtend*.o "$TOOLCHAIN/lib/crtend.o" 2>/dev/null || true
            ln -sf "$CRT_DIR"/clang_rt.crtendS*.o "$TOOLCHAIN/lib/crtendS.o" 2>/dev/null || true
            BUILTINS_A=$(find "$CRT_DIR" -name "libclang_rt.builtins*.a" | head -n 1)
            if [ -n "$BUILTINS_A" ]; then
              ln -sf "$BUILTINS_A" "$TOOLCHAIN/lib/libgcc.a"
              ln -sf "$BUILTINS_A" "$TOOLCHAIN/lib/libgcc_eh.a"
              ln -sf "$BUILTINS_A" "$TOOLCHAIN/lib/libatomic.a"
            fi
          fi
          if [ -e "$TOOLCHAIN/lib/libunwind.so" ]; then
            echo "GROUP ( libunwind.so.1 libgcc.a -lc )" > "$TOOLCHAIN/lib/libgcc_s.so"
            echo "INPUT ( libunwind.so.1 )" > "$TOOLCHAIN/lib/libunwind.a"
          fi

          cat << 'EOF' > "$TOOLCHAIN/bin/clang.cfg"
          --rtlib=compiler-rt
          --unwindlib=libunwind
          -fuse-ld=lld
          -B<CFGDIR>/../lib
          -L<CFGDIR>/../lib
          -Wl,-rpath,<CFGDIR>/../lib
          EOF

          cat << 'EOF' > "$TOOLCHAIN/bin/clang++.cfg"
          --rtlib=compiler-rt
          --unwindlib=libunwind
          --stdlib=libc++
          -fuse-ld=lld
          -B<CFGDIR>/../lib
          -L<CFGDIR>/../lib
          -Wl,-rpath,<CFGDIR>/../lib
          EOF

          cat << 'EOF' > "$TOOLCHAIN/bin/flang.cfg"
          -fuse-ld=lld
          -B<CFGDIR>/../lib
          -L<CFGDIR>/../lib
          -Wl,-rpath,<CFGDIR>/../lib
          EOF

          # 3. Gera o script oficial install-ubuntu26.04-deps.sh dentro da toolchain (Enxuto — Sem curl/ssl de gerenciadores de pacotes!)
          cat << 'EOF' > "$TOOLCHAIN/install-ubuntu26.04-deps.sh"
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo"
          else
            SUDO=""
          fi
          echo "📦 Instalando bibliotecas dinâmicas nativas de sistema do Ubuntu 26.04 para o OmniLLVM (Zero GCC / Zero Package Managers)..."
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends \
            libc6-dev \
            libedit2 libncurses6 libncurses-dev libtinfo6 \
            zlib1g zlib1g-dev libzstd1 liblzma5 libuuid1 \
            libicu78 libxml2-16 \
            libblocksruntime0 libblocksruntime-dev \
            libgnat-15

          MULTIARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || uname -m | sed 's/x86_64/x86_64-linux-gnu/;s/aarch64/aarch64-linux-gnu/')
          if [ -d "/opt/omnillvm/lib" ]; then
            for item in crtbegin.o crtbeginS.o crtbeginT.o crtend.o crtendS.o libgcc.a libgcc_eh.a libgcc_s.so libunwind.a libatomic.a libatomic.so libatomic.so.1; do
              if [ -e "/opt/omnillvm/lib/$item" ] && [ ! -e "/usr/lib/$MULTIARCH/$item" ]; then
                $SUDO ln -sf "/opt/omnillvm/lib/$item" "/usr/lib/$MULTIARCH/$item" 2>/dev/null || true
              fi
            done
          fi
          echo "✅ Todas as bibliotecas dinâmicas de sistema do Ubuntu 26.04 foram instaladas com sucesso!"
          EOF
          chmod +x "$TOOLCHAIN/install-ubuntu26.04-deps.sh"

          # 4. Aplica RPATH relativo completo ($ORIGIN) em todos os binários e libs próprias da toolchain
          find "$TOOLCHAIN/bin" -type f -executable -exec file {} + | awk -F: '/ELF/ {print $1}' | \
            xargs -P "$CORES" -n 10 patchelf --set-rpath '$ORIGIN/../lib:$ORIGIN/../lib/swift/linux:$ORIGIN/../lib/swift/host:$ORIGIN/../lib/swift/host/compiler:$ORIGIN' 2>/dev/null || true

          find "$TOOLCHAIN/lib" -maxdepth 4 -type f -name "*.so*" -exec file {} + | awk -F: '/ELF/ {print $1}' | \
            xargs -P "$CORES" -n 10 patchelf --set-rpath '$ORIGIN:$ORIGIN/swift/linux:$ORIGIN/swift/host:$ORIGIN/swift/host/compiler:$ORIGIN/..:$ORIGIN/../..' 2>/dev/null || true

          # 5. Deduplicação física por Symlinks Relativos
          rdfind -makesymlinks true -makeresultsfile false "$TOOLCHAIN"
          symlinks -cr "$TOOLCHAIN"

          # Preserva os symlinks externos para a libgnat-15 do Ubuntu (após symlinks -cr)
          if [ -d "$TOOLCHAIN/lib/rts-native/adalib" ]; then
            ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnat-15.so" "$TOOLCHAIN/lib/rts-native/adalib/libgnat.so"
            ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnat-15.so" "$TOOLCHAIN/lib/rts-native/adalib/libgnat-15.so"
            ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnarl-15.so" "$TOOLCHAIN/lib/rts-native/adalib/libgnarl.so"
            ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnarl-15.so" "$TOOLCHAIN/lib/rts-native/adalib/libgnarl-15.so"
            ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnat-15.so" "$TOOLCHAIN/lib/libgnat-15.so"
            ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnat-15.so" "$TOOLCHAIN/lib/libgnat.so"
            ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnarl-15.so" "$TOOLCHAIN/lib/libgnarl-15.so"
            ln -sfn "/usr/lib/${{ matrix.gnu_triple }}/libgnarl-15.so" "$TOOLCHAIN/lib/libgnarl.so"
          fi

          # 6. Strip Cirúrgico em Paralelo (Preserva DWARF dos runtimes de linguagem)
          find "$TOOLCHAIN/bin" -type f -print0 | xargs -0 -n 10 -P "$CORES" "$STRIP" --strip-unneeded 2>/dev/null || true
          find "$TOOLCHAIN/lib" -maxdepth 1 -type f \( \
            -name "libLLVM*.so*" -o -name "libclang*.so*" -o -name "libMLIR*.so*" -o \
            -name "libFortran*.so*" -o -name "liblldb*.so*" -o -name "librustc_driver*.so*" \
          \) -print0 | xargs -0 -n 4 -P "$CORES" "$STRIP" --strip-unneeded 2>/dev/null || true

      - name: "🧪 2. Auditoria ELF Global (Cenários A e B) + Suíte Industrial de 7 Testes (${{ matrix.arch }})"
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        run: |
          TOOLCHAIN="${{ env.INSTALL_PREFIX }}"

          echo "===================================================================="
          echo "🧹 REMOVENDO COMPILADORES GCC/G++/GNAT/LLVM DO CONTAINER"
          echo "===================================================================="
          apt-get purge -y gcc g++ gnat gcc-14 g++-14 gnat-14 gcc-15 g++-15 gnat-15 \
            libgcc-14-dev libgcc-15-dev libstdc++-14-dev libstdc++-15-dev \
            clang clang-21 lld lld-21 lldb lldb-21 || true

          echo "===================================================================="
          echo "📦 EXECUTANDO O SCRIPT OFICIAL install-ubuntu26.04-deps.sh"
          echo "===================================================================="
          "$TOOLCHAIN/install-ubuntu26.04-deps.sh"

          export PATH="$TOOLCHAIN/bin:$PATH"
          TEST_DIR=$(mktemp -d /tmp/omnillvm-tests.XXXXXX)
          cd "$TEST_DIR"

          echo "===================================================================="
          echo "🧪 INICIANDO AUDITORIA 100% PURE SWIFT-LLVM (CENÁRIOS A & B INCLUSOS)"
          echo "===================================================================="

          # [1/7] CENÁRIO B: Varredura Global de ldd em TODOS os executáveis e TODAS as .so da toolchain!
          echo "-> [1/7] Varrendo TODOS os binários e bibliotecas ELF da toolchain contra 'not found' e 'libpython'..."
          if ldd "$TOOLCHAIN/bin/lldb" "$TOOLCHAIN/lib/liblldb.so"* | grep -q "libpython"; then
            echo "❌ ERRO FATAL: libpython encontrada no LLDB (${{ matrix.arch }})!"
            exit 1
          fi
          BROKEN_ELFS=0
          for elf in $(find "$TOOLCHAIN/bin" "$TOOLCHAIN/lib" -type f \( -executable -o -name "*.so*" \) -exec file {} + | awk -F: '/ELF/ {print $1}'); do
            MISSING=$(ldd "$elf" 2>/dev/null | grep "not found" || true)
            if [ -n "$MISSING" ]; then
              echo "❌ Dependência ausente em $elf:"
              echo "$MISSING"
              BROKEN_ELFS=1
            fi
          done
          if [ "$BROKEN_ELFS" -ne 0 ]; then
            echo "❌ ERRO FATAL: Foram encontradas bibliotecas ausentes na varredura global ELF!"
            exit 1
          fi
          echo "✅ [1/7] Varredura ELF Global 100% Limpa: Zero 'not found' em toda a árvore /opt/omnillvm!"

          # [2/7] Teste C23 + C++23 usando 100% Swift-LLVM (compiler-rt + libc++ + libunwind + ld.lld)
          echo "-> [2/7] Testando Clang/Clang++ Pure Swift-LLVM (compiler-rt + libc++ + libunwind + lld)..."
          cat << 'EOF' > test_c.c
          int c_add(int a, int b) { return a + b; }
          EOF
          cat << 'EOF' > test_cpp.cpp
          #include <iostream>
          #include <vector>
          #include <string>
          #include <stdexcept>
          extern "C" int c_add(int a, int b);
          extern "C" int rust_mul(int a, int b);
          int main() {
              try {
                  throw std::runtime_error("swift_llvm_libunwind_ok");
              } catch (const std::exception& e) {
                  std::vector<std::string> v = {"OmniLLVM", "Pure-Swift-LLVM-libc++", e.what()};
                  if (c_add(20, 22) != 42 || rust_mul(6, 7) != 42) return 1;
                  std::cout << "✅ [2/7] C/C++/Rust FFI & Swift-LLVM libunwind/libc++ OK: " << v[0] << " (" << v[2] << ")\n";
              }
              return 0;
          }
          EOF
          "$TOOLCHAIN/bin/clang" -O3 -c test_c.c -o test_c.o
          "$TOOLCHAIN/bin/clang++" -O3 -std=c++23 -c test_cpp.cpp -o test_cpp.o

          # [3/7] Teste Rustc 1.94.0 (Sem Cargo — Compilação direta de staticlib FFI e binário multi-thread)
          echo "-> [3/7] Testando Rustc 1.94.0 Pure LLVM (FFI + Stdlib Threads sem GCC e sem Cargo)..."
          cat << 'EOF' > test_rust_ffi.rs
          #[no_mangle]
          pub extern "C" fn rust_mul(a: i32, b: i32) -> i32 { a * b }
          EOF
          "$TOOLCHAIN/bin/rustc" -O --crate-type=staticlib test_rust_ffi.rs -o librust_ffi.a
          "$TOOLCHAIN/bin/clang++" -O3 test_cpp.o test_c.o librust_ffi.a -lpthread -ldl -o test_ffi_bin
          ./test_ffi_bin

          cat << 'EOF' > test_rust_bin.rs
          use std::thread;
          fn main() {
              let h = thread::spawn(|| (1..=10).sum::<i32>());
              assert_eq!(h.join().unwrap(), 55);
              println!("✅ [3/7] Rustc 1.94.0 Runtime & Threads OK (Linkado via Clang/LLD sem GCC)!");
          }
          EOF
          "$TOOLCHAIN/bin/rustc" -O -C linker="$TOOLCHAIN/bin/clang" -C link-arg=-L"$TOOLCHAIN/lib" test_rust_bin.rs -o test_rust_bin
          ./test_rust_bin

          # [4/7] Teste Swiftc 6.4.1 (swiftc + libswiftCore.so + libdispatch.so + clang/lld)
          echo "-> [4/7] Testando Swiftc 6.4.1 (swiftc + libswiftCore.so + libdispatch.so)..."
          cat << 'EOF' > test_swift.swift
          import Dispatch
          struct Point { var x: Int; var y: Int }
          let p = Point(x: 20, y: 22)
          assert(p.x + p.y == 42)
          print("✅ [4/7] Swiftc 6.4.1 Runtime, Stdlib & libdispatch OK: \(p.x + p.y)")
          EOF
          "$TOOLCHAIN/bin/swiftc" -O -use-ld=lld test_swift.swift -L"$TOOLCHAIN/lib" -L"$TOOLCHAIN/lib/swift/linux" -Xlinker -rpath -Xlinker "$TOOLCHAIN/lib" -Xlinker -rpath -Xlinker "$TOOLCHAIN/lib/swift/linux" -o test_swift_bin
          ./test_swift_bin

          # [5/7] Teste Ada GNAT-LLVM 27.1 (llvm-gnatmake 100% sem gcc/gnat instalado no sistema!)
          echo "-> [5/7] Testando Ada GNAT-LLVM 27.1 (llvm-gnatmake + libgnat-15.so do APT)..."
          cat << 'EOF' > hello_ada.adb
          with Ada.Text_IO; use Ada.Text_IO;
          procedure Hello_Ada is
             X : constant Integer := 42;
          begin
             Put_Line ("✅ [5/7] Ada GNAT-LLVM 27.1 Pure LLVM Runtime OK:" & Integer'Image (X));
          end Hello_Ada;
          EOF
          export ADA_INCLUDE_PATH="$TOOLCHAIN/lib/rts-native/adainclude"
          export ADA_OBJECTS_PATH="$TOOLCHAIN/lib/rts-native/adalib"
          "$TOOLCHAIN/bin/llvm-gnatmake" -O3 hello_ada.adb -largs -L"$TOOLCHAIN/lib" -Wl,-rpath,"$TOOLCHAIN/lib"
          ./hello_ada

          # [6/7] CENÁRIO A: Teste Fortran Flang 21 (100% Standalone com flang-rt I/O + ISO_C_BINDING ABI)
          echo "-> [6/7] Testando Fortran Flang 21 (Executável 100% Fortran Standalone com flang-rt + ISO_C_BINDING)..."
          FLANG_BIN=$(ls "$TOOLCHAIN/bin/flang" "$TOOLCHAIN/bin/flang-new" 2>/dev/null | head -n 1)
          cat << 'EOF' > hello_standalone.f90
          program hello_fortran
            implicit none
            integer :: a, b
            a = 20
            b = 22
            if (a + b /= 42) stop 1
            print '(A,I2)', "✅ [6A/7] Fortran 100% Standalone (flang-rt I/O) OK: ", a + b
          end program hello_fortran
          EOF
          "$FLANG_BIN" -O3 hello_standalone.f90 -L"$TOOLCHAIN/lib" -Wl,-rpath,"$TOOLCHAIN/lib" -o hello_standalone
          ./hello_standalone

          cat << 'EOF' > test_fortran.f90
          pure integer function fort_square(x) bind(c, name="fort_square")
            use iso_c_binding, only: c_int
            integer(c_int), value, intent(in) :: x
            fort_square = x * x
          end function fort_square
          EOF
          "$FLANG_BIN" -O3 -c test_fortran.f90 -o test_fortran.o
          cat << 'EOF' > test_fort_main.c
          #include <stdio.h>
          extern int fort_square(int x);
          int main() {
              if (fort_square(7) != 49) return 1;
              printf("✅ [6B/7] Fortran (Flang 21 ISO_C_BINDING) ABI OK: %d\n", fort_square(7));
              return 0;
          }
          EOF
          "$TOOLCHAIN/bin/clang" -O3 test_fort_main.c test_fortran.o -o test_fort_bin
          ./test_fort_bin

          # [7/7] Teste LLDB Batch Mode
          echo "-> [7/7] Testando LLDB Batch Mode..."
          "$TOOLCHAIN/bin/lldb" --batch -o "target create ./test_ffi_bin" -o "version" -o "quit"
          echo "✅ [7/7] LLDB Batch Execution OK!"

          cd /opt && rm -rf "$TEST_DIR"
          echo "===================================================================="
          echo "🎉 TODOS OS 7 TESTES (INCLUINDO CENÁRIOS A E B) PASSARAM COM 100%!"
          echo "===================================================================="

      - name: 3. Compactar Pacote Final com ZSTD Nível 19 Multi-Thread (${{ matrix.arch }})
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        run: |
          cd /opt
          tar -I "zstd -19 -T0" -cf $GITHUB_WORKSPACE/omnillvm-toolchain-ubuntu26.04-${{ matrix.arch }}.tar.zst omnillvm

      - name: 4. Salvar Cache do Pacote Final (Stage 3 - ${{ matrix.arch }})
        if: steps.pkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: omnillvm-toolchain-ubuntu26.04-${{ matrix.arch }}.tar.zst
          key: omnillvm-final-pkg-${{ env.PACKAGE_CACHE_REV }}-${{ env.CORE_CACHE_REV }}-${{ env.FRONTEND_CACHE_REV }}-${{ matrix.arch }}

      - name: Upload do Pacote Final (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: release-pkg-${{ matrix.arch }}
          path: omnillvm-toolchain-ubuntu26.04-${{ matrix.arch }}.tar.zst
          compression-level: 0
          retention-days: 1

  # ============================================================================
  # ESTÁGIO 4: Publica AMD64 e ARM64 + Script APT na Release
  # ============================================================================
  publish-release:
    name: "Stage 4: Publish Release (Ubuntu 26.04 AMD64 + ARM64)"
    needs: package-arch
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout (para consultar tags existentes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar Pacotes Finais
        uses: actions/download-artifact@v4
        with:
          pattern: "release-pkg-*"
          merge-multiple: true

      - name: Gerar Script de Instalação APT para Release, Calcular Versão e Checksums SHA256
        id: meta
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            NEXT_VER="${{ inputs.release_tag }}"
          else
            LAST_VER=$(git ls-remote --tags --refs origin | awk -F'refs/tags/' '{print $2}' | grep -E '^[0-9]+$' | sort -n | tail -n 1)
            if [ -z "$LAST_VER" ]; then
              NEXT_VER=1
            else
              NEXT_VER=$(( LAST_VER + 1 ))
            fi
          fi

          # Gera o script standalone install-ubuntu26.04-deps.sh (Enxuto — Sem libs de gerenciadores de pacotes)
          cat << 'EOF' > install-ubuntu26.04-deps.sh
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo"
          else
            SUDO=""
          fi
          echo "📦 Instalando bibliotecas dinâmicas nativas de sistema do Ubuntu 26.04 para o OmniLLVM (Zero GCC / Zero Package Managers)..."
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends \
            libc6-dev \
            libedit2 libncurses6 libncurses-dev libtinfo6 \
            zlib1g zlib1g-dev libzstd1 liblzma5 libuuid1 \
            libicu78 libxml2-16 \
            libblocksruntime0 libblocksruntime-dev \
            libgnat-15

          MULTIARCH=$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || uname -m | sed 's/x86_64/x86_64-linux-gnu/;s/aarch64/aarch64-linux-gnu/')
          if [ -d "/opt/omnillvm/lib" ]; then
            for item in crtbegin.o crtbeginS.o crtbeginT.o crtend.o crtendS.o libgcc.a libgcc_eh.a libgcc_s.so libunwind.a libatomic.a libatomic.so libatomic.so.1; do
              if [ -e "/opt/omnillvm/lib/$item" ] && [ ! -e "/usr/lib/$MULTIARCH/$item" ]; then
                $SUDO ln -sf "/opt/omnillvm/lib/$item" "/usr/lib/$MULTIARCH/$item" 2>/dev/null || true
              fi
            done
          fi
          echo "✅ Dependências de sistema instaladas! Extraia o pacote em /opt/omnillvm e adicione /opt/omnillvm/bin ao PATH."
          EOF
          chmod +x install-ubuntu26.04-deps.sh

          echo "🚀 Publicando Release Versão: $NEXT_VER"
          echo "tag=$NEXT_VER" >> $GITHUB_OUTPUT

          sha256sum omnillvm-toolchain-ubuntu26.04-*.tar.zst install-ubuntu26.04-deps.sh > SHA256SUMS.txt
          ls -lh omnillvm-toolchain-ubuntu26.04-*.tar.zst install-ubuntu26.04-deps.sh
          cat SHA256SUMS.txt

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "OmniLLVM Unified Toolchain - Release ${{ steps.meta.outputs.tag }} [Ubuntu 26.04 | AMD64 & ARM64]"
          body: |
            ### OmniLLVM Unified Toolchain — Ubuntu 26.04 LTS (`amd64` & `arm64`)
            Toolchain **100% Pure Swift-LLVM Hermética** (Zero dependência de `gcc`, `libgcc-dev`, `libstdc++-dev` e zero gerenciadores de pacotes externos), unificando `libLLVM.so` 21 (`swift/release/6.4.1`), `compiler-rt`, `libc++`, `libunwind`, `libdispatch`, `flang-rt` e `ld.lld` para **C, C++, Fortran (Flang), Ada (GNAT 27.1), Rust (Rustc 1.94.0) e Swift (Swiftc 6.4.1)**.

            #### 1. Extrair em `/opt/omnillvm` e instalar dependências de sistema do Ubuntu 26.04 (Sem GCC):
            ```bash
            sudo tar -I zstd -xf omnillvm-toolchain-ubuntu26.04-$(dpkg --print-architecture).tar.zst -C /opt/
            sudo /opt/omnillvm/install-ubuntu26.04-deps.sh
            export PATH="/opt/omnillvm/bin:$PATH"
            ```
          files: |
            omnillvm-toolchain-ubuntu26.04-amd64.tar.zst
            omnillvm-toolchain-ubuntu26.04-arm64.tar.zst
            install-ubuntu26.04-deps.sh
            SHA256SUMS.txt
